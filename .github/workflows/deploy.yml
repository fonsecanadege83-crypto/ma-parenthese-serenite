name: Déployer Sérénité sur GitHub Pages

on:
  push:
    branches: [claude/wellness-app-uizxj6, main]
    paths:
      - 'wellness-app/**'
      - '.github/workflows/deploy.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: wellness-app/package-lock.json

      - name: Install dependencies
        working-directory: wellness-app
        run: npm ci

      - name: Type-check
        working-directory: wellness-app
        run: npx tsc -b --noEmit

      - name: Build
        working-directory: wellness-app
        run: npm run build

      - name: SPA fallback for client-side routing
        run: cp wellness-app/dist/index.html wellness-app/dist/404.html

      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: wellness-app/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
